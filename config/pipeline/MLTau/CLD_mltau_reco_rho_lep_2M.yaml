  tree:
    enabled: true
    mode: reco
    prefix: PolAnalysis_RECO_CLD_ztt2M_smearingChanged_MLTau_
    config: config/default/taurecolong_optimal.yaml
    n_workers: 20
    decay_modes: [0, 1, 2, 10, -11, -13]
