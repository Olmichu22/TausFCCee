# ═══════════════════════════════════════════════════════════════════════════
# CLD, ztt_2M_smearing (ficheros 1-2000 = 2M sucesos) con los taus hadrónicos de
# ParTauDETR en vez de los del cono (--mltau-predictions). Electrones y muones
# salen de electronReco / muonReco; los jets con un e/mu reco se vetan.
# Modo rho-lepton, con y sin los cortes legacy de
# config/pipeline/CLD_ILD_smearingChanged/CLD_reco.yaml, sin²θ_eff = 0.2315.
#   python RhoAnalysis/runTreeHistPipeline_MDecs.py --pipeline-config <este fichero>
# input_list tiene que coincidir con los ficheros de las predicciones
# (MLTauReco/condor/ztt_2M_smearing_files_1-2000.txt).
# ═══════════════════════════════════════════════════════════════════════════

