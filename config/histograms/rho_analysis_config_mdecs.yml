# rho_analysis_config_mdecs.yml
#
# Configuración para RhoHistFromTree_MDecs_parallel.py.
# Lee árboles tau1_*/tau2_* (genOnlyRHOTree_parallel.py).
#
# Cada hemisferio tiene sus propios histogramas (_dec0, _dec1).
# Las categorías usan doble sufijo: {cat_este}_{cat_otro}.
#
# Combinaciones de categorías definidas (16):
#   ALL_ALL         — todo evento que pasa cortes
#   SIGNAL_SIGNAL   — ambos hemisferios correctos
#   SIGNAL_BG       — este=signal, otro=cualquier fondo
#   BG_SIGNAL       — este=fondo, otro=signal
#   SIGNAL_BGMuon/Ele/Pion/Rho/A1/Other  — este=signal, otro=fondo específico
#   BGMuon/Ele/Pion/Rho/A1/Other_SIGNAL  — este=fondo específico, otro=signal

defaults:
  categories:
    ALL_ALL:        {weights: [P1, M1, corr_P1, corr_M1]}
    SIGNAL_SIGNAL:  {weights: [P1, M1, corr_P1, corr_M1]}
    SIGNAL_BG:      {weights: []}
    BG_SIGNAL:      {weights: []}
    SIGNAL_BGMuon:  {weights: []}
    SIGNAL_BGEle:   {weights: []}
    SIGNAL_BGPion:  {weights: []}
    SIGNAL_BGRho:   {weights: []}
    SIGNAL_BGA1:    {weights: []}
    SIGNAL_BGOther: {weights: []}
    BGMuon_SIGNAL:  {weights: []}
    BGEle_SIGNAL:   {weights: []}
    BGPion_SIGNAL:  {weights: []}
    BGRho_SIGNAL:   {weights: []}
    BGA1_SIGNAL:    {weights: []}
    BGOther_SIGNAL: {weights: []}

# Alias YAML para la lista completa de categorías (shorthand)
_all_cats: &all_cats
  - ALL_ALL
  - SIGNAL_SIGNAL
  - SIGNAL_BG
  - BG_SIGNAL
  - SIGNAL_BGMuon
  - SIGNAL_BGEle
  - SIGNAL_BGPion
  - SIGNAL_BGRho
  - SIGNAL_BGA1
  - SIGNAL_BGOther
  - BGMuon_SIGNAL
  - BGEle_SIGNAL
  - BGPion_SIGNAL
  - BGRho_SIGNAL
  - BGA1_SIGNAL
  - BGOther_SIGNAL

# Categorías para el fit de polarización a nivel RECO: variantes de peso reco
# (reco_P1/M1/corr) en las categorías donde el hemisferio objetivo es SIGNAL
# (plantillas de morphing); nominal en el resto (los fondos no se repesan).
_reco_fit_cats: &reco_fit_cats
  ALL_ALL:        {weights: [P1, M1, corr_P1, corr_M1, reco_P1, reco_M1, reco_corr_P1, reco_corr_M1]}
  SIGNAL_SIGNAL:  {weights: [P1, M1, corr_P1, corr_M1, reco_P1, reco_M1, reco_corr_P1, reco_corr_M1]}
  SIGNAL_BG:      {weights: [P1, M1, corr_P1, corr_M1, reco_P1, reco_M1, reco_corr_P1, reco_corr_M1]}
  SIGNAL_BGMuon:  {weights: [P1, M1, corr_P1, corr_M1, reco_P1, reco_M1, reco_corr_P1, reco_corr_M1]}
  SIGNAL_BGEle:   {weights: [P1, M1, corr_P1, corr_M1, reco_P1, reco_M1, reco_corr_P1, reco_corr_M1]}
  SIGNAL_BGPion:  {weights: [P1, M1, corr_P1, corr_M1, reco_P1, reco_M1, reco_corr_P1, reco_corr_M1]}
  SIGNAL_BGRho:   {weights: [P1, M1, corr_P1, corr_M1, reco_P1, reco_M1, reco_corr_P1, reco_corr_M1]}
  SIGNAL_BGA1:    {weights: [P1, M1, corr_P1, corr_M1, reco_P1, reco_M1, reco_corr_P1, reco_corr_M1]}
  SIGNAL_BGOther: {weights: [P1, M1, corr_P1, corr_M1, reco_P1, reco_M1, reco_corr_P1, reco_corr_M1]}
  BG_SIGNAL:      {weights: []}
  BGMuon_SIGNAL:  {weights: []}
  BGEle_SIGNAL:   {weights: []}
  BGPion_SIGNAL:  {weights: []}
  BGRho_SIGNAL:   {weights: []}
  BGA1_SIGNAL:    {weights: []}
  BGOther_SIGNAL: {weights: []}

histograms:
