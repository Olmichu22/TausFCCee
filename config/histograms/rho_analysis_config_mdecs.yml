    # Omega_RhoMass_Bin2_plus_dec1:  {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin2_minus_dec0: {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin2_minus_dec1: {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin3_plus_dec0:  {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin3_plus_dec1:  {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin3_minus_dec0: {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin3_minus_dec1: {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin4_plus_dec0:  {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin4_plus_dec1:  {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin4_minus_dec0: {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin4_minus_dec1: {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin5_plus_dec0:  {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin5_plus_dec1:  {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin5_minus_dec0: {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin5_minus_dec1: {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin6_plus_dec0:  {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin6_plus_dec1:  {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin6_minus_dec0: {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}
    # Omega_RhoMass_Bin6_minus_dec1: {type: 1D, bins: 100, range: [-1, 1], categories: {ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}}}

  # ──────────────────────────────────────────────────────────────────────────
  # Reco — por hemisferio
  # ──────────────────────────────────────────────────────────────────────────
  Reco:

    Omega_Reco_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    Omega_Reco_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    # ── Omega_Reco en 6 bins de masa reco del rho (recoVisM) — desglose señal/BG ──
    # Mismo binado que gen (Omega_RhoMass_Bin*) pero usando recoVisM y omega reco.
    Omega_Reco_RhoMass_Bin1_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats
    Omega_Reco_RhoMass_Bin1_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    Omega_Reco_RhoMass_Bin2_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats
    Omega_Reco_RhoMass_Bin2_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    Omega_Reco_RhoMass_Bin3_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats
    Omega_Reco_RhoMass_Bin3_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    Omega_Reco_RhoMass_Bin4_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats
    Omega_Reco_RhoMass_Bin4_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    Omega_Reco_RhoMass_Bin5_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats
    Omega_Reco_RhoMass_Bin5_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    Omega_Reco_RhoMass_Bin6_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats
    Omega_Reco_RhoMass_Bin6_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    CosTheta_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    CosTheta_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    CosPsi_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    CosPsi_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories: *reco_fit_cats

    RecoVisEOverBeamE_dec0:
      type: 1D
      bins: 50
      range: [0, 1.1]
      categories: *reco_fit_cats

    RecoVisEOverBeamE_dec1:
      type: 1D
      bins: 50
      range: [0, 1.1]
      categories: *reco_fit_cats

    RecoVisCosTheta_dec0:
      type: 1D
      bins: 201
      range: [-1, 1]
      categories: *reco_fit_cats

    RecoVisCosTheta_dec1:
      type: 1D
      bins: 201
      range: [-1, 1]
      categories: *reco_fit_cats

    RecoVisP_dec0:
      type: 1D
      bins: 100
      range: [0, 50]
      categories: *reco_fit_cats

    RecoVisP_dec1:
      type: 1D
      bins: 100
      range: [0, 50]
      categories: *reco_fit_cats

    RecoDecayType_dec0:
      type: 1D
      bins: 31
      range: [-15, 15]
      categories:
        SIGNAL_SIGNAL: {weights: []}
        BG_SIGNAL:     {weights: []}
        SIGNAL_BG:     {weights: []}
        ALL_ALL:       {weights: []}

    RecoDecayType_dec1:
      type: 1D
      bins: 31
      range: [-15, 15]
      categories:
        SIGNAL_SIGNAL: {weights: []}
        BG_SIGNAL:     {weights: []}
        SIGNAL_BG:     {weights: []}
        ALL_ALL:       {weights: []}

    Optimal_X_dec0:
      type: 1D
      bins: 50
      range: [-1.5, 1.5]
      categories:
        SIGNAL_SIGNAL: {weights: [P1, M1, corr_P1, corr_M1]}
        ALL_ALL:       {weights: []}
        BG_SIGNAL:     {weights: []}
        SIGNAL_BG:     {weights: []}

    Optimal_X_dec1:
      type: 1D
      bins: 50
      range: [-1.5, 1.5]
      categories:
        SIGNAL_SIGNAL: {weights: [P1, M1, corr_P1, corr_M1]}
        ALL_ALL:       {weights: []}
        BG_SIGNAL:     {weights: []}
        SIGNAL_BG:     {weights: []}

    # 2D var-óptima-reco × cosθ-visible-reco para el fit de polarización (A_τ/A_e).
    # X = variable óptima reco del canal (ω reco para ρ; x reco para π/lep);
    # Y = cosθ visible reco (binado angular para el fit P_τ(cosθ)).
    OptimalReco_vs_CosThetaVis_dec0:
      type: 2D
      x_bins: 100
      x_range: [-1, 1]
      y_bins: 20
      y_range: [-1, 1]
      categories: *reco_fit_cats

    OptimalReco_vs_CosThetaVis_dec1:
      type: 2D
      x_bins: 100
      x_range: [-1, 1]
      y_bins: 20
      y_range: [-1, 1]
      categories: *reco_fit_cats

    # Variable óptima del ρ vía red neuronal (modelo v2), salida ∈[0,1]. Solo se
    # llena en el hemisferio ρ de pares ρ-leptón (flag --use-nn-optimal).
    OptimalNN_Reco_dec0:
      type: 1D
      bins: 50
      range: [0, 1]
      categories:
        SIGNAL_SIGNAL: {weights: [P1, M1, corr_P1, corr_M1]}
        ALL_ALL:       {weights: []}
        BG_SIGNAL:     {weights: []}
        SIGNAL_BG:     {weights: []}

    OptimalNN_Reco_dec1:
      type: 1D
      bins: 50
      range: [0, 1]
      categories:
        SIGNAL_SIGNAL: {weights: [P1, M1, corr_P1, corr_M1]}
        ALL_ALL:       {weights: []}
        BG_SIGNAL:     {weights: []}
        SIGNAL_BG:     {weights: []}

    # 2D salida-NN × cosθ-visible-reco para el fit de polarización (análogo a
    # OptimalReco_vs_CosThetaVis pero con la variable óptima de la red).
    OptimalNN_vs_CosThetaVis_dec0:
      type: 2D
      x_bins: 100
      x_range: [0, 1]
      y_bins: 20
      y_range: [-1, 1]
      categories: *reco_fit_cats

    OptimalNN_vs_CosThetaVis_dec1:
      type: 2D
      x_bins: 100
      x_range: [0, 1]
      y_bins: 20
      y_range: [-1, 1]
      categories: *reco_fit_cats

    DeltaR_dec0_dec1:
      type: 1D
      bins: 100
      range: [0, 5]
      categories:
        SIGNAL_SIGNAL: {weights: []}
        ALL_ALL:       {weights: []}

    # Reco — compartidos
    RecoZMass:
      type: 1D
      bins: 200
      range: [0, 100]
      categories:
        SIGNAL_SIGNAL: {weights: []}
        ALL_ALL:       {weights: []}

    # ── Separación por carga τ⁺/τ⁻ (tauPDG) — Reco ──
    Omega_Reco_plus_dec0:   {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
    Omega_Reco_plus_dec1:   {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
    Omega_Reco_minus_dec0:  {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
    Omega_Reco_minus_dec1:  {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
    Optimal_X_plus_dec0:   {type: 1D, bins: 50, range: [-1.5, 1.5], categories: {SIGNAL_SIGNAL: {weights: [P1, M1, corr_P1, corr_M1]}, ALL_ALL: {weights: []}, BG_SIGNAL: {weights: []}, SIGNAL_BG: {weights: []}}}
    Optimal_X_plus_dec1:   {type: 1D, bins: 50, range: [-1.5, 1.5], categories: {SIGNAL_SIGNAL: {weights: [P1, M1, corr_P1, corr_M1]}, ALL_ALL: {weights: []}, BG_SIGNAL: {weights: []}, SIGNAL_BG: {weights: []}}}
    Optimal_X_minus_dec0:  {type: 1D, bins: 50, range: [-1.5, 1.5], categories: {SIGNAL_SIGNAL: {weights: [P1, M1, corr_P1, corr_M1]}, ALL_ALL: {weights: []}, BG_SIGNAL: {weights: []}, SIGNAL_BG: {weights: []}}}
    Optimal_X_minus_dec1:  {type: 1D, bins: 50, range: [-1.5, 1.5], categories: {SIGNAL_SIGNAL: {weights: [P1, M1, corr_P1, corr_M1]}, ALL_ALL: {weights: []}, BG_SIGNAL: {weights: []}, SIGNAL_BG: {weights: []}}}

