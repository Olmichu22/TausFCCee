    Omega_RhoMass_Bin3_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories:
        ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}

    Omega_RhoMass_Bin4_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories:
        ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}
    Omega_RhoMass_Bin4_dec1:
      type: 1D
      bins: 100
      range: [-1, 1]
      categories:
        ALL_ALL: {weights: [P1, M1, corr_P1, corr_M1]}

    Omega_RhoMass_Bin5_dec0:
      type: 1D
      bins: 100
      range: [-1, 1]
