    # en FILL_RULES_PER_DEC; aquí solo se definen los histogramas.
    Omega_plus_dec0:   {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
    Omega_plus_dec1:   {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
    Omega_minus_dec0:  {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
    Omega_minus_dec1:  {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
    Omega_minus_NegHel_dec0: {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
    Omega_minus_NegHel_dec1: {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
    Omega_minus_PosHel_dec0: {type: 1D, bins: 100, range: [-1, 1], categories: *all_cats}
