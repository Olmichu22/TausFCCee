    OptimalVar_plus_NegHel_dec1: {type: 1D, bins: 100, range: [0, 1], categories: *all_cats}
    OptimalVar_plus_PosHel_dec1: {type: 1D, bins: 100, range: [0, 1], categories: *all_cats}
    # Helicidad combinada en carga (Cepeda, basada en helicidad del τ⁻)
    OptimalVar_HelNeg_dec0: {type: 1D, bins: 100, range: [0, 1], categories: *all_cats}
    OptimalVar_HelNeg_dec1: {type: 1D, bins: 100, range: [0, 1], categories: *all_cats}
    OptimalVar_HelPos_dec0: {type: 1D, bins: 100, range: [0, 1], categories: *all_cats}
