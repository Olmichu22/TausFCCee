  CLD_EffP_Dec0:
    per_dataset:
      "CLD Correct": hEffiGenTauP0Correct
      "CLD #rightarrow h #gamma": hEffiGenTauP0Toh1g
      "CLD #rightarrow h 2#gamma": hEffiGenTauP0Toh2g
      "CLD Not reconstructed": hEffiGenTauP0ToLost
