# Datasets: mismo par de ficheros (CLD / ILD) declarado varias veces,
# una entrada por "rol" (categoria reco, resonancia, ...) para poder
# darle color/estilo propio a cada curva via per_dataset.
# CLD: &cldpath /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_CLD_FCC_2M_OptCutsCLD_PionPhotonFSR_tau_trained0.4_tph0.35_tpi0_n3_g0.0/tau_traineddecayAll_0.4_tph0.35_tpi0_n3_g0.0.root
CLD: &cldpath /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_CLD_FCC_2M_OptCutsCLD_smearingChanged_fsrCorrection_tau_trained0.4_tph0.35_tpi0_n3_g0.0/tau_traineddecayAll_0.4_tph0.35_tpi0_n3_g0.0.root
ILD: &ildpath /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_ILD_FCC_2M_OptCutsCLD_smearingChanged_fsrCorrection_tau_trained0.4_tph0.35_tpi0_n3_g0.0/tau_traineddecayAll_0.4_tph0.35_tpi0_n3_g0.0.root

# Graficos ToLost: los produce TauAnalysis/mergeMigrationCategories.py a partir
# del fichero principal (hay que regenerarlos cada vez que se rehace la reco).
# CLDmerged: &cldmerged /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_CLD_FCC_2M_OptCutsCLD_PionPhotonFSR_tau_trained0.4_tph0.35_tpi0_n3_g0.0/migration_merged.root

CLDmerged: &cldmerged /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_CLD_FCC_2M_OptCutsCLD_smearingChanged_fsrCorrection_tau_trained0.4_tph0.35_tpi0_n3_g0.0/migration_merged.root
ILDmerged: &ildmerged /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_ILD_FCC_2M_OptCutsCLD_smearingChanged_fsrCorrection_tau_trained0.4_tph0.35_tpi0_n3_g0.0/migration_merged.root

# Previous CLD /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_CLD_FCC_2M_OptCutsCLD_cosaccept_tau_trained0.4_tph0.35_tpi0_n3_g0.0/tau_traineddecayAll_0.4_tph0.35_tpi0_n3_g0.0.root
# Previous ILD   - path: /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_ILD_FCC_2M_OptCutsCLD_cosaccept_tau_trained0.4_tph0.35_tpi0_n3_g0.0/tau_traineddecayAll_0.4_tph0.35_tpi0_n3_g0.0.root
datasets:
  # --- comparacion directa CLD vs ILD (una curva por detector) ---
  - path: *cldpath
    label: "CLD"
    color: ROOT.kAzure+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  # --- CLD: desglose por categoria reconstruida ---
  - path: *cldpath
    label: "CLD Correct"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow h"
    color: ROOT.kAzure+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow h #gamma"
    color: ROOT.kGreen+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow h 2#gamma"
    color: ROOT.kOrange+7
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow h 3#gamma"
    color: ROOT.kMagenta+1
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow h 4#gamma"
    color: ROOT.kCyan+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow h #geq5#gamma"
    color: ROOT.kYellow+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow 3h"
    color: ROOT.kViolet+1
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow 3h #gamma"
    color: ROOT.kSpring+4
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow 3h 2#gamma"
    color: ROOT.kPink+7
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow e"
    color: ROOT.kGray+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow #mu"
    color: ROOT.kBlue+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rightarrow 3h + n"
    color: ROOT.kOrange-3
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldmerged
    label: "CLD Not reconstructed"
    color: ROOT.kTeal+3
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  # --- ILD: desglose por categoria reconstruida ---
  - path: *ildpath
    label: "ILD Correct"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow h"
    color: ROOT.kAzure+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow h #gamma"
    color: ROOT.kGreen+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow h 2#gamma"
    color: ROOT.kOrange+7
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow h 3#gamma"
    color: ROOT.kMagenta+1
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow h 4#gamma"
    color: ROOT.kCyan+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow h #geq5#gamma"
    color: ROOT.kYellow+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow 3h"
    color: ROOT.kViolet+1
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow 3h #gamma"
    color: ROOT.kSpring+4
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow 3h 2#gamma"
    color: ROOT.kPink+7
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow e"
    color: ROOT.kGray+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow #mu"
    color: ROOT.kBlue+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildpath
    label: "ILD #rightarrow 3h + n"
    color: ROOT.kOrange-3
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *ildmerged
    label: "ILD Not reconstructed"
    color: ROOT.kTeal+3
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  # --- masas: ILD con relleno, CLD solo linea ---
  - path: *ildpath
    label: "ILD m_{Z}"
    color: ROOT.kRed
    linestyle: 2
    markerstyle: 21
    markersize: 1.
    linewidth: 3
    fill: true
    fillstyle: 3006
    fillalpha: 1.0

  - path: *ildpath
    label: "ILD #rho #rightarrow #pi#pi^{0}"
    color: ROOT.kRed
    linestyle: 2
    markerstyle: 21
    markersize: 1.
    linewidth: 3
    fill: true
    fillstyle: 3006
    fillalpha: 1.0

  - path: *ildpath
    label: "ILD a_{1} #rightarrow #pi#pi^{0}#pi^{0}"
    color: ROOT.kAzure+2
    linestyle: 2
    markerstyle: 21
    markersize: 1.
    linewidth: 3
    fill: true
    fillstyle: 3006
    fillalpha: 1.0

  - path: *ildpath
    label: "ILD a_{1} #rightarrow #pi#pi#pi"
    color: ROOT.kGreen+2
    linestyle: 2
    markerstyle: 21
    markersize: 1.
    linewidth: 3
    fill: true
    fillstyle: 3006
    fillalpha: 1.0

  - path: *ildpath
    label: "ILD #pi^{0}"
    color: ROOT.kViolet+1
    linestyle: 2
    markerstyle: 21
    markersize: 1.
    linewidth: 3
    fill: true
    fillstyle: 3006
    fillalpha: 1.0

  - path: *cldpath
    label: "CLD m_{Z}"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #rho #rightarrow #pi#pi^{0}"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD a_{1} #rightarrow #pi#pi^{0}#pi^{0}"
    color: ROOT.kAzure+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD a_{1} #rightarrow #pi#pi#pi"
    color: ROOT.kGreen+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *cldpath
    label: "CLD #pi^{0}"
    color: ROOT.kViolet+1
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

