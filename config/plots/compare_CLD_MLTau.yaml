# CLD, ztt_2M_smearing: reco de cono (TauTool) frente a ParTauDETR (MLTau).
# Mismo esquema que compare_CLD_ILD.yaml: cada fichero se declara varias veces,
# una entrada por "rol", para dar color/estilo propio a cada curva via per_dataset.
#
#   python TauAnalysis/CompareAlgs.py -c config/plots/compare_CLD_MLTau.yaml -o <outdir>
TauTool: &ttpath /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_CLD_FCC_2M_OptCutsCLD_smearingChanged_fsrCorrection_tau_trained0.4_tph0.35_tpi0_n3_g0.0/tau_traineddecayAll_0.4_tph0.35_tpi0_n3_g0.0.root
MLTau: &mlpath /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_CLD_FCC_2M_MLTau_tau_trained0.4_tph0.35_tpi0_n3_g0.0/tau_traineddecayAll_0.4_tph0.35_tpi0_n3_g0.0.root

# Graficos ToLost y Theta*Correct: los produce TauAnalysis/mergeMigrationCategories.py
# a partir del fichero principal (hay que regenerarlos cada vez que se rehace la reco).
TauToolmerged: &ttmerged /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_CLD_FCC_2M_OptCutsCLD_smearingChanged_fsrCorrection_tau_trained0.4_tph0.35_tpi0_n3_g0.0/migration_merged.root
MLTaumerged: &mlmerged /nfs/cms/arqolmo/TausFCCee/Results/TauReco/merged_CLD_FCC_2M_MLTau_tau_trained0.4_tph0.35_tpi0_n3_g0.0/migration_merged.root

datasets:
  # --- comparacion directa TauTool vs MLTau (una curva por algoritmo) ---
  - path: *ttpath
    label: "TauTool"
    color: ROOT.kAzure+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *mlpath
    label: "MLTau"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  # --- idem para los graficos de migration_merged.root (legend_label: texto de la leyenda) ---
  - path: *ttmerged
    label: "TauTool merged"
    legend_label: "TauTool"
    color: ROOT.kAzure+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *mlmerged
    label: "MLTau merged"
    legend_label: "MLTau"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  # --- TauTool: desglose por categoria reconstruida ---
  - path: *ttpath
    label: "TauTool Correct"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow h"
    color: ROOT.kAzure+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow h #gamma"
    color: ROOT.kGreen+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow h 2#gamma"
    color: ROOT.kOrange+7
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow h 3#gamma"
    color: ROOT.kMagenta+1
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow h 4#gamma"
    color: ROOT.kCyan+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow h #geq5#gamma"
    color: ROOT.kYellow+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow 3h"
    color: ROOT.kViolet+1
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow 3h #gamma"
    color: ROOT.kSpring+4
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow 3h 2#gamma"
    color: ROOT.kPink+7
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow e"
    color: ROOT.kGray+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow #mu"
    color: ROOT.kBlue+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttpath
    label: "TauTool #rightarrow 3h + n"
    color: ROOT.kOrange-3
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttmerged
    label: "TauTool Correct (merged)"
    legend_label: "TauTool Correct"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  - path: *ttmerged
    label: "TauTool Not reconstructed"
    color: ROOT.kTeal+3
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

  # --- MLTau: desglose por categoria reconstruida ---
  - path: *mlpath
    label: "MLTau Correct"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *mlpath
    label: "MLTau #rightarrow h"
    color: ROOT.kAzure+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *mlpath
    label: "MLTau #rightarrow h #pi^{0}"
    color: ROOT.kOrange+7
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *mlpath
    label: "MLTau #rightarrow h 2#pi^{0}"
    color: ROOT.kCyan+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *mlpath
    label: "MLTau #rightarrow h #geq3#pi^{0}"
    color: ROOT.kYellow+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *mlpath
    label: "MLTau #rightarrow 3h"
    color: ROOT.kViolet+1
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *mlpath
    label: "MLTau #rightarrow 3h #pi^{0}"
    color: ROOT.kPink+7
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *mlpath
    label: "MLTau #rightarrow e"
    color: ROOT.kGray+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *mlpath
    label: "MLTau #rightarrow #mu"
    color: ROOT.kBlue+2
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *mlmerged
    label: "MLTau Correct (merged)"
    legend_label: "MLTau Correct"
    color: ROOT.kRed
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  - path: *mlmerged
    label: "MLTau Not reconstructed"
    color: ROOT.kTeal+3
    linestyle: 1
    markerstyle: 21
    markersize: 1.
    linewidth: 3

  # --- masa visible del Z ---
  - path: *mlpath
    label: "MLTau m_{Z}"
    color: ROOT.kRed
    linestyle: 2
    markerstyle: 21
    markersize: 1.
    linewidth: 3
    fill: true
    fillstyle: 3006
    fillalpha: 1.0

  - path: *ttpath
    label: "TauTool m_{Z}"
    color: ROOT.kAzure+2
    linestyle: 1
    markerstyle: 20
    markersize: 1.
    linewidth: 3

# "Correct" es el modo gen bien identificado; en TauTool un pi0 vale como 1 o 2
# fotones (pi pi0 = h1g + h2g, pi 2pi0 = h3g + h4g), asi que esas categorias no
# se pintan aparte como migracion. En MLTau cada pi0 predicho cuenta como dos
# fotones (h2g = h pi0, h4g = h 2pi0, 3h2g = 3h pi0) y las impares estan vacias.
plots:
  TauTool_EffP_Dec0:
    per_dataset:
      "TauTool Correct": hEffiGenTauP0Correct
      "TauTool #rightarrow h #gamma": hEffiGenTauP0Toh1g
      "TauTool #rightarrow h 2#gamma": hEffiGenTauP0Toh2g
      "TauTool Not reconstructed": hEffiGenTauP0ToLost
    title: '\text{TauTool efficiency: }\tau \rightarrow \pi \nu'
    x: "P [GeV/c]"
    y: "Efficiency"
    y_range: [0.0, 1.45]
    legend: [0.38, 0.655, 0.94, 0.915]
    legend_ncolumns: 2
    legend_txt_size: 0.038
    gridy: true

  MLTau_EffP_Dec0:
    per_dataset:
