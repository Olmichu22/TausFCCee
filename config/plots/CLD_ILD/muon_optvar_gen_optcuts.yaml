datasets:
  - path: /nfs/cms/arqolmo/TausFCCee/TauPolOutputs/CLD_ILD/merged_histos/CLD_gen_muon_nocuts.root
    label: CLD gen
    color: ROOT.kOrange+7
    linestyle: 1
    markerstyle: 24
    markersize: 1.0
    linewidth: 3
  - path: /nfs/cms/arqolmo/TausFCCee/TauPolOutputs/CLD_ILD/merged_histos/ILD_gen_muon_nocuts.root
    label: ILD gen
    color: ROOT.kAzure+7
    linestyle: 1
    markerstyle: 25
    markersize: 1.0
    linewidth: 3

plots:
  optvar_gen_signal:
    per_dataset:
      'CLD gen': Optimal_X_dec0_SIGNAL_BG
      'ILD gen': Optimal_X_dec0_SIGNAL_BG
    title: '\text{Optimal variable, } \mu^{\pm} + X \text{ (signal)}'
    x: 'z_{\mu}'
    y: 'Norm. events'
    normalize: "integral"
    legend: [0.60, 0.72, 0.90, 0.90]
  optvar_gen_allall:
    per_dataset:
      'CLD gen': Optimal_X_dec0_ALL_ALL
      'ILD gen': Optimal_X_dec0_ALL_ALL
    title: '\text{Optimal variable, } \mu^{\pm} + X \text{ (all selected)}'
    x: 'z_{\mu}'
    y: 'Norm. events'
    normalize: "integral"
    legend: [0.60, 0.72, 0.90, 0.90]
