schema_version: fcc_mc_comparison_v1
scientific_contract:
  freeze: "2026-09-01"
  selected_truth: selected_truth_v1
  tau_origin: stored_recursive_ancestor_abs_pdg_15
  geometric_association: {implementation: modules.NeutralRecover.get_reco_mc_links_by_dR, max_dR: 0.1, metric: theta_phi, dedup_mode: reco}
  direct_assignment: truthlink_assignment_v1
  ancestor_assignment: truthlink_ancestor_assignment_v1
  representative_pfo: frozen_track_then_cluster_weight_ranking
  pid_denominator: associated_unique_only
  momentum_residual: (reco_p-truth_p)/truth_p
  theta_residual: (reco_theta-truth_theta)*pi/180*1000_mrad
  central68_halfwidth: (q84-q16)/2

# Optional truth-side acceptance for additive machine-readable performance
# tables. Null means no cut and therefore preserves selected_truth_v1 exactly.
performance:
  association_method: Lancestor
  truth_p_min: null
  truth_theta_min_deg: null
  truth_theta_max_deg: null
  efficiency_bins:
    p: [0.0, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0, 20.0, 50.0, 100.0]
    theta: [0.0, 10.0, 20.0, 30.0, 40.0, 50.0, 60.0, 70.0, 80.0, 90.0, 100.0, 110.0, 120.0, 130.0, 140.0, 150.0, 160.0, 170.0, 180.0]
    phi: [-3.141592653589793, -2.6179938779914944, -2.0943951023931957, -1.5707963267948966, -1.0471975511965979, -0.5235987755982988, 0.0, 0.5235987755982988, 1.0471975511965976, 1.5707963267948966, 2.094395102393195, 2.617993877991494, 3.141592653589793]

